[server]
# The cloud host chooses its listener. The local opsfusion.service command
# explicitly binds the dashboard to 127.0.0.1 by default.
maxUploadSize = 100
headless = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#187F75"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EAF0F5"
textColor = "#172C3C"
font = "sans serif"
