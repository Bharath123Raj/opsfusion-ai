[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Public browser configuration. Row-level policies protect site data.
  VITE_SUPABASE_URL = "https://blvorawnwbcnujnapmgg.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6laMcNqezfhsBFFUUANPIw_q_ZANFup"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://blvorawnwbcnujnapmgg.supabase.co wss://blvorawnwbcnujnapmgg.supabase.co; img-src 'self' blob: data: https://blvorawnwbcnujnapmgg.supabase.co; media-src 'self' blob: https://blvorawnwbcnujnapmgg.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
